
name: Build Meshtastic RA-02

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout firmware
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build RA-02
        run: pio run -e meshtastic-ra02

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic-ra02
          path: .pio/build/meshtastic-ra02/firmware.bin
          if-no-files-found: error
